# vizi releases — single source of truth for the public download channel.
#
# The publish workflow WRITES this file (newest release prepended). The site
# builds everything else from it:
#   - releases/latest.json  the update feed the app polls (newest eligible release)
#   - download.html         the current build (+ a beta block when one is newer)
#   - changelog.html        every release, newest first, under a #<version> anchor
#
# Installers live on the download host, not in this repo:
#   https://downloads.vizi.science/<version>/<asset>
#
# The site carries no release older than 1.0.0; the first public release is the
# 1.0.0 beta. The list stays empty until that first publish.
#
# ORDER: releases MUST be listed newest first. The build trusts this order; it
# does not sort by version or date.
#
# Field contract (schema 1) — one mapping per release:
#   version      PEP 440, no leading 'v' (e.g. "1.0.0b1", "1.0.0")
#   tag          the git tag (e.g. "v1.0.0b1")
#   published    release time, ISO 8601 UTC (e.g. "2026-02-10T18:30:00Z")
#   prerelease   true for a beta/rc, false for a final release
#   notes        release notes, markdown, verbatim from the GitHub release.
#                Rendered on changelog.html via `markdownify`. User-facing only.
#   downloads    per-OS installer URL on downloads.vizi.science:
#                  windows / macos / linux
#   sha256       per-OS sha256 of that asset (64 lowercase hex):
#                  windows / macos / linux
#   size         per-OS asset size in BYTES (integer):
#                  windows / macos / linux
#                (size is not derivable at build time, so the workflow records it;
#                 the download page shows it next to each button.)
#
# FEED ELIGIBILITY (how releases/latest.json picks "latest"):
#   1. newest FINAL release that has downloads; else
#   2. newest release of ANY kind that has downloads (so the first public build,
#      the 1.0.0 beta, is served until a final ships).
# A release without downloads is never eligible. A pre-release never stays
# "latest" once a published final exists (rule 1 wins). When nothing is eligible
# (the list is empty), the feed is emitted as `{}` — GitHub Pages cannot skip a
# generated file conditionally, and the app treats an unparseable feed as a quiet
# failed update check.

schema: 1

# No public release yet. The publish workflow prepends the first entry (the
# 1.0.0 beta) following the field contract above.
releases:
  - version: "0.9.6"
    tag: "v0.9.6"
    published: "2026-10-22T18:10:53Z"
    prerelease: false
    notes: |2
      ## New features

      - **Registration.** vizi asks for your name, email and organisation when it starts; you can put it off for five launches, after which it is required. About shows your registration and offers Register… if you skipped it. Only those three fields are sent, to the FOCO Lab, and the dialog says how to have them removed.
      - **Help → Send feedback…** sends anonymous feedback to the FOCO Lab from inside vizi, queued and sent in the background, with a checkbox to include your vizi version, operating system, graphics adapter and log file name. Put an email address in the text if you want a reply.
      - **The macOS app is signed and notarized.** First launch is a plain double-click; macOS shows its standard confirmation for a downloaded app once, and no Open Anyway is needed.
      - **Crash stacks in the log.** If vizi crashes, the session log ends with every thread's stack; attach it to a report.

      ## Bug fixes

      - Quitting while a file was still opening aborted the process and left a crash report.
      - On Windows, quitting could end with an access-violation dialog.
      - A file that failed to open after the window was closed left an error dialog behind.
      - Quitting while the 2D view was still reading a plane could crash on the way out.
      - Opening the Performance panel took width from the view.
      - GIF movies exported at 30 fps played about 10 percent fast.
      - Cmd+Q and Ctrl+Q did nothing while the startup About dialog was open.
      - A movie exported from the demo dataset was written into vizi's cache folder instead of somewhere you would find it.
      - On Windows, updating a plugin could fail because the old version's process had not yet let go of its folder.

      ## Upgrade notes

      - **The scroll wheel in the 2D view now zooms** about the pointer. **Ctrl+wheel** (Cmd+wheel on macOS) steps through Z, which the plain wheel did before. Right-drag still zooms.
      - **Movie export:** MP4 (H.264) on macOS and Windows uses the system's encoder; on Linux, movies export as WebM (VP9). The bundled ffmpeg is an LGPL build with no GPL encoders.
      - **Every installation now ships vizi's End User Licence Agreement** (`LICENSE`) and `THIRD_PARTY_NOTICES.txt` beside it, listing every bundled component, its licence, and where the FFmpeg and libvpx sources are.
