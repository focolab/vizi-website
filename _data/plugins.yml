# vizi accepted-plugin catalog — source of truth, hand-edited.
#
# One entry per accepted plugin = its CURRENT accepted version. Accepting a new
# version is an edit to that entry; this file's git history is the acceptance
# record. The build (plugins/catalog.json) serves these to the app; the Plugins
# page (plugins.html) lists them. Validate/fill hashes with:
#     python script/verify-plugins.py            # re-check every live entry
#     python script/verify-plugins.py --fetch <asset_url>   # print sha256 + size
#
# Field contract (frozen 2026-10-13, vizi-website#13; mirror of the plugin
# manifest where noted). Every field below is required on a live entry:
#   id          manifest `id` (reverse-DNS)
#   name        manifest `name`
#   summary     one line
#   repo        https repo URL
#   version     accepted plugin version (== manifest `version`)
#   min_vizi    minimum vizi APP version, full string (app floor; NOT engines.vizi).
#               verify-plugins.py requires >= 0.9.5 when the asset's manifest
#               declares protocol engines.vizi 1.0 (the catalog-aware client floor).
#   sdk_version SDK version the release was built against (what Ready/doctor print)
#   asset_url   https URL of the release asset the app downloads
#   size        asset size in bytes
#   sha256      sha256 of the asset, 64 lowercase hex
#   permissions copied verbatim from the manifest `permissions`
#   license     SPDX id of the plugin's license, read from its repo LICENSE file
#               (e.g. Apache-2.0, MIT, BSD-3-Clause, GPL-3.0-only, GPL-3.0-or-later).
#               Shown in vizi's install prompt and on the Plugins page before a
#               download. verify-plugins.py refuses an id it does not know. Added
#               without a schema bump — 1.0.0 clients ignore keys they do not know.
#
# Optional per entry (schema 1):
#   platforms   list from linux-x86_64 / macos-arm64 / windows-x86_64; ABSENT means
#               all three. The v0.9.5+ client offers an entry only on a listed
#               platform. (vizi-website#21; omitted from catalog.json when absent.)
#   extensions  list of lowercase file suffixes, each with a leading dot (e.g.
#               [".czi", ".lif"]), copied from the asset manifest's
#               contributions.readers[].extensions at acceptance (the primary list,
#               not fallback_extensions), de-duplicated and sorted. ABSENT or empty
#               means the plugin opens no formats and is never offered on open.
#               Drives vizi's offer-on-open (vizi#1031): a file that no installed
#               reader handles but a catalog plugin declares prompts to install that
#               plugin. verify-plugins.py requires this to equal the manifest's
#               declared reader suffixes. (Omitted from catalog.json when absent.)
#   fallback_extensions
#               like `extensions` but for suffixes a reader CAN open yet should not
#               be picked for unasked — copied from the manifest's
#               contributions.readers[].fallback_extensions at acceptance, same
#               lowercase-dotted rule, de-duplicated and sorted. ABSENT means none;
#               an empty list is refused. vizi 1.0.1 offers a fallback-only plugin
#               when a file's type has no installed reader and no primary-declaring
#               catalog entry; a reader that declares the suffix in `extensions`
#               keeps precedence. verify-plugins.py requires this to equal the
#               manifest's declared fallbacks. (Omitted from catalog.json when absent.)
#   setup_downloads
#               list of runtimes the plugin's setup fetches that are NOT Python or
#               its packages (ABSENT means Python and its packages only). vizi's
#               install prompt shows these before the person consents. Each item:
#                 name     non-empty string the person sees
#                 version  the runtime version
#                 size     download size in BYTES (positive integer)
#                 source   where it is fetched from
#                 license  SPDX id, or GPL-2.0-with-classpath-exception for a JRE
#                 kept     "plugin" (in the plugin's folder) or "shared" (vizi's
#                          data folder)
#               vizi 1.0.1 renders the list VERBATIM in the install prompt, so write
#               values that read well: each item becomes "the {name} {version}
#               (about N MB) from {source}" (N = size/1_000_000 rounded, missing
#               parts left out; items join "a and b" / "a, b and c"); a licensed item
#               adds "The {name} is under the {license} and carries its license
#               files", {license} shown exactly. `name` is a SINGULAR noun phrase
#               that reads after "the" ("Eclipse Temurin JRE"), never a plural; the
#               verb agrees with the item count. `kept: plugin` reads "kept in the
#               plugin's folder", `kept: shared` "kept there too". Give ONE size per
#               item; for a range (56–62 MB) use the largest. The host drops the
#               whole list if an item has no name or there are more than 16 items;
#               verify-plugins.py refuses both.
#               (Omitted from catalog.json when absent; vizi reads the same shape.)
#   replaces    list of plugin ids this entry renames FROM. vizi 1.0.1+ treats an
#               entry that lists an installed plugin's old id here as that plugin's
#               update and carries its settings across; nothing new is shown to the
#               user. Each id is validated like `id`; ABSENT means none. Only the
#               catalog may declare a rename, never a plugin's own manifest.
#               ACCEPTING A RENAME: the new entry's repo must have the SAME owner as
#               the replaced plugin, and the replaced plugin's own entry MUST be
#               removed in the same change. verify-plugins.py enforces that a
#               replaced id is not also a live entry and is claimed by only one
#               entry. (Omitted from catalog.json when absent.)
#
# `pending: true` marks an entry whose release is not yet public: it is shown on
# the Plugins page as pending and is NOT emitted to catalog.json (so the app
# never offers an asset that does not yet exist). Remove it once the release is
# live and the asset_url/sha256/size are final.

schema: 1

# Accepted plugins, one mapping per accepted version (fields above). Fill size +
# sha256 with `script/verify-plugins.py --fetch <asset_url>`.
plugins:
  - id: org.focolab.vizi_quant
    name: vizi-quant
    summary: "Region quantification and plotting — measures every region on every frame, plots the traces (raw F or ΔF/F), exports tables."
    repo: https://github.com/focolab/vizi-quant
    version: "0.1.1"
    min_vizi: "1.0.0"
    sdk_version: "1.0.0"
    asset_url: https://github.com/focolab/vizi-quant/releases/download/v0.1.1/org.focolab.vizi_quant-0.1.1.zip
    size: 498683
    sha256: 66ed71dc1dae49d50c6292031f86d8058a54d0ce97cbad254d7e916fda3e0e97
    permissions: [data_access]
    license: "Apache-2.0"

  - id: org.focolab.nwb
    name: NWB
    summary: "Opens the images in NWB (Neurodata Without Borders) files — NWBelegans NeuroPAL volumes and calcium imaging series included, with their calibration and channel names."
    repo: https://github.com/focolab/vizi-nwb
    version: "0.1.1"
    min_vizi: "1.0.0"
    sdk_version: "1.0.0"
    asset_url: https://github.com/focolab/vizi-nwb/releases/download/v0.1.1/org.focolab.nwb-0.1.1.zip
    size: 499220
    sha256: cc9c7bd642abff50e8a643c0f7bd9aad48d00f2af3d6453d53e4166f935962c9
    permissions: []
    extensions: [".nwb"]
    fallback_extensions: [".h5", ".hdf5"]
    license: "Apache-2.0"

  - id: org.focolab.bioformats
    name: Bio-Formats
    summary: "Opens almost any scientific imaging format (CZI, ND2, LIF, whole-slide images and some 220 more suffixes) through Bio-Formats 8.5.0; a file with several images asks which one."
