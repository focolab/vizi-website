# vizi accepted-plugin catalog — source of truth, hand-edited.
#
# One entry per accepted plugin = its CURRENT accepted version. Accepting a new
# version is an edit to that entry; this file's git history is the acceptance
# record. The build (plugins/catalog.json) serves these to the app; the Plugins
# page (plugins.html) lists them. Validate/fill hashes with:
#     python script/verify-plugins.py            # re-check every live entry
#     python script/verify-plugins.py --fetch <asset_url>   # print sha256 + size
#
# Field contract (frozen 2026-10-13, vizi-website#13; mirror of the plugin
# manifest where noted). Every field below is required on a live entry:
#   id          manifest `id` (reverse-DNS)
#   name        manifest `name`
#   summary     one line
#   repo        https repo URL
#   version     accepted plugin version (== manifest `version`)
#   min_vizi    minimum vizi APP version, full string (app floor; NOT engines.vizi).
#               verify-plugins.py requires >= 0.9.5 when the asset's manifest
#               declares protocol engines.vizi 1.0 (the catalog-aware client floor).
#   sdk_version SDK version the release was built against (what Ready/doctor print)
#   asset_url   https URL of the release asset the app downloads
#   size        asset size in bytes
#   sha256      sha256 of the asset, 64 lowercase hex
#   permissions copied verbatim from the manifest `permissions`
#
# Optional per entry (schema 1):
#   platforms   list from linux-x86_64 / macos-arm64 / windows-x86_64; ABSENT means
#               all three. The v0.9.5+ client offers an entry only on a listed
#               platform. (vizi-website#21; omitted from catalog.json when absent.)
#   extensions  list of lowercase file suffixes, each with a leading dot (e.g.
#               [".czi", ".lif"]), copied from the asset manifest's
#               contributions.readers[].extensions at acceptance (the primary list,
#               not fallback_extensions), de-duplicated and sorted. ABSENT or empty
#               means the plugin opens no formats and is never offered on open.
#               Drives vizi's offer-on-open (vizi#1031): a file that no installed
#               reader handles but a catalog plugin declares prompts to install that
#               plugin. verify-plugins.py requires this to equal the manifest's
#               declared reader suffixes. (Omitted from catalog.json when absent.)
#
# `pending: true` marks an entry whose release is not yet public: it is shown on
# the Plugins page as pending and is NOT emitted to catalog.json (so the app
# never offers an asset that does not yet exist). Remove it once the release is
# live and the asset_url/sha256/size are final.

schema: 1

# Accepted plugins, one mapping per accepted version (fields above). Fill size +
# sha256 with `script/verify-plugins.py --fetch <asset_url>`.
plugins:
  - id: org.focolab.vizi_quant
    name: vizi-quant
    summary: "Region quantification and plotting — measures every region on every frame, plots the traces (raw F or ΔF/F), exports tables."
    repo: https://github.com/focolab/vizi-quant
    version: "0.1.0"
    min_vizi: "1.0.0"
    sdk_version: "1.0.0"
    asset_url: https://github.com/focolab/vizi-quant/releases/download/v0.1.0/org.focolab.vizi_quant-0.1.0.zip
    size: 498563
    sha256: d5356ddba94feb266c97eba5e24a509aa9682a04e2d95c998e6fc894d5cba271
    permissions: [data_access]
